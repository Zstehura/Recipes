# CodeQL static analysis: scans the code for security vulnerabilities and common bugs.
# Results appear under the repository's Security tab, then Code scanning.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new vulnerability queries are run even when the code hasn't changed.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read            # read workflow run metadata
      security-events: write   # upload results to code scanning

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp       # the application and test code
            build-mode: none       # analyze source directly; no build needed
          - language: actions      # the GitHub Actions workflows themselves
            build-mode: none

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Run analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
